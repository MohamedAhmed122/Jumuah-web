services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://127.0.0.1:27017/jumuah}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-now}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:4000}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - PORT=4000
    volumes:
      - uploads-data:/app/uploads

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

volumes:
  uploads-data:
