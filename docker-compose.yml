services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/jumuah
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-now}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:4000}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - PORT=4000
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-69}:80"
    depends_on:
      - server

volumes:
  mongo-data:
  uploads-data:
